<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Coordinador</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/estilo.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="dashboard-container">

  <h2 class="dashboard-title">🧭 Dashboard Coordinador</h2>

  <!-- ================= ALERTAS ================= -->
  <div class="section">
    <h3>🚨 Alertas Clínicas</h3>
    <div class="table-wrapper">
      <table id="tabla-alertas" class="styled-table"></table>
    </div>
  </div>

  <!-- ================= FILTROS ================= -->
  <div class="section filtros">

    <div class="filtro-item">
      <label>Paciente</label>
      <select id="paciente_select" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>

    <div class="filtro-item">
      <label>Fecha</label>
      <input type="date" id="filtro_fecha" onchange="aplicarFiltros()">
    </div>

    <div class="filtro-buttons">
      <button onclick="exportExcel()" class="btn-primary">Exportar Excel</button>
      <button onclick="exportPDF()" class="btn-primary">Exportar PDF</button>
    </div>

  </div>

  <button class="btn-primary" onclick="irAsistencia()">📋 Planilla Asistencia</button>
  <button class="btn-primary" onclick="irAportes()">💰 Planilla Aportes</button>
  <button class="btn-primary" onclick="irADashboardParamedico()">🩺 Tomar Signos Vitales</button>

  <button class="btn-danger"
  onclick="localStorage.clear(); window.location.href='login.html'">
  Cerrar sesión
  </button>

  <!-- ================= TABLA ================= -->
  <div class="section">
    <div class="table-wrapper">
      <table id="tabla-registros" class="styled-table">
        <thead>
          <tr>
            <th>Paciente</th>
            <th>Sexo</th>
            <th>Fecha / Hora</th>
            <th>PA</th>
            <th>FR</th>
            <th>FC</th>
            <th>SpO₂</th>
            <th>Temp</th>
            <th>Observaciones</th>
            <th>Registrado por</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</div>

<script src="dashboards.js"></script>
<script>
const API = 'http://localhost:3000';
const token = localStorage.getItem('token');
const rol = localStorage.getItem('rol');

if (!token || rol !== 'coordinador') {
  alert('Acceso no autorizado');
  window.location.href = 'login.html';
}

let registrosTotales = [];
let registrosFiltrados = [];

// =======================
// 🔥 NUEVA FUNCION SEGURA
// =======================
function formatearUsuario(registrado_por) {
  if (!registrado_por) return "—";

  // 👉 SI VIENE COMO OBJETO (nuevo backend)
  if (typeof registrado_por === "object") {
    return `${registrado_por.apellido || ''}, ${registrado_por.nombre || ''}`;
  }

  // 👉 SI VIENE COMO STRING (lo que tenías antes)
  return registrado_por;
}

// =======================
// FECHA + HORA
// =======================
function formatearFechaHora(fechaISO, horaControl) {
  if (!fechaISO) return "—";
  try {
    const fechaObj = new Date(fechaISO);
    const fechaFormateada = fechaObj.toLocaleDateString('es-AR', { 
      day:'2-digit', month:'2-digit', year:'numeric' 
    });
    return horaControl ? `${fechaFormateada} ${horaControl}` : fechaFormateada;
  } catch(err) {
    console.error("Error formateando fecha:", fechaISO, err);
    return "—";
  }
}

// ===============================
// CARGAR ALERTAS
// ===============================
async function cargarAlertas() {
  try {
    const res = await fetch(`${API}/dashboard/alertas`, { headers:{ 'Authorization':'Bearer '+token }});
    const data = await res.json();
    const tabla = document.getElementById('tabla-alertas');
    tabla.innerHTML = `<tr><th>Paciente</th><th>FC</th><th>FR</th><th>SpO₂</th><th>Temp</th><th>Fecha</th></tr>`;
    data.forEach(a=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${a.apellido_nombre}</td>
        <td>${a.frecuencia_cardiaca || ''}</td>
        <td>${a.frecuencia_respiratoria || ''}</td>
        <td>${a.spo2 || ''}</td>
        <td>${a.temperatura || ''}</td>
        <td>${formatearFechaHora(a.fecha, a.hora_control)}</td>
      `;
      tabla.appendChild(tr);
    });
  } catch(err){console.error('Error alertas:', err);}
}

// ===============================
// CARGAR REGISTROS
// ===============================
async function cargarRegistros() {
  try {
    const res = await fetch(`${API}/registros_signos`, { headers:{ 'Authorization':'Bearer '+token }});
    registrosTotales = await res.json();
    registrosFiltrados = [...registrosTotales];
    cargarPacientesSelect();
    renderTabla();
  } catch(err){ console.error('Error registros:', err); }
}

// ===============================
// FILTROS
// ===============================
function cargarPacientesSelect() {
  const select = document.getElementById('paciente_select');
  select.innerHTML = '<option value="">Todos</option>';
  [...new Set(registrosTotales.map(r=>r.paciente))].forEach(nombre=>{
    const opt = document.createElement('option');
    opt.value = nombre;
    opt.textContent = nombre;
    select.appendChild(opt);
  });
}

function aplicarFiltros() {
  const paciente = document.getElementById('paciente_select').value;
  const fecha = document.getElementById('filtro_fecha').value;
  registrosFiltrados = registrosTotales.filter(r=>{
    let ok = true;
    if(paciente) ok = ok && r.paciente === paciente;
    if(fecha) ok = ok && r.fecha === fecha;
    return ok;
  });
  renderTabla();
}

// ===============================
// TABLA
// ===============================
function renderTabla() {
  const tbody = document.querySelector("#tabla-registros tbody");
  if(!tbody) return;
  tbody.innerHTML = "";

  registrosFiltrados.forEach(r=>{
    const fila = document.createElement("tr");

    fila.innerHTML = `
      <td>${r.paciente || "—"}</td>
      <td>${r.sexo || "—"}</td>
      <td>${formatearFechaHora(r.fecha, r.hora_control)}</td>
      <td>${r.presion_arterial || "—"}</td>
      <td>${r.frecuencia_respiratoria || "—"}</td>
      <td>${r.frecuencia_cardiaca || "—"}</td>
      <td>${r.spo2 || "—"}</td>
      <td>${r.temperatura || "—"}</td>
      <td>${r.observaciones || "—"}</td>
      <td>${formatearUsuario(r.registrado_por)}</td>
      <td>${r.rol_usuario || "—"}</td>
    `;

    tbody.appendChild(fila);
  });
}

// ===============================
// EXPORT
// ===============================
function exportExcel() {
  if(!registrosFiltrados.length) return alert('No hay datos');
  const wb = XLSX.utils.book_new();
  const exportData = registrosFiltrados.map(r=>({
    Paciente: r.paciente,
    Sexo: r.sexo||'—',
    'Fecha / Hora': formatearFechaHora(r.fecha,r.hora_control),
    PA: r.presion_arterial||'',
    FR: r.frecuencia_respiratoria||'',
    FC: r.frecuencia_cardiaca||'',
    'SpO₂': r.spo2||'',
    Temp: r.temperatura||'',
    Observaciones: r.observaciones||'',
    'Registrado por': formatearUsuario(r.registrado_por),
    Rol: r.rol_usuario||''
  }));
  const ws = XLSX.utils.json_to_sheet(exportData);
  XLSX.utils.book_append_sheet(wb, ws, 'Registros');
  XLSX.writeFile(wb, 'registros_coordinador.xlsx');
}

function exportPDF() {
  if(!registrosFiltrados.length) return alert('No hay datos');
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  const cols = ['Paciente','Sexo','Fecha / Hora','PA','FR','FC','SpO₂','Temp','Observaciones','Registrado por','Rol'];
  const rows = registrosFiltrados.map(r=>[
    r.paciente,
    r.sexo||'—',
    formatearFechaHora(r.fecha,r.hora_control),
    r.presion_arterial||'',
    r.frecuencia_respiratoria||'',
    r.frecuencia_cardiaca||'',
    r.spo2||'',
    r.temperatura||'',
    r.observaciones||'',
    formatearUsuario(r.registrado_por),
    r.rol_usuario||''
  ]);
  doc.autoTable({head:[cols],body:rows});
  doc.save('registros_coordinador.pdf');
}

// ===============================
// NAV
// ===============================
function irADashboardParamedico() {
  window.location.href = 'dashboard_paramedico.html';
}

function irAsistencia() {
  window.location.href = 'asistencia.html';
}

function irAportes() {
  window.location.href = 'aportes.html';
}

// ===============================
// INIT
// ===============================
window.onload = () => {
  cargarAlertas();
  cargarRegistros();
};
</script>

</body>
</html>
