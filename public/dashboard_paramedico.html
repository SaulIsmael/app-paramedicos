<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Dashboard Paramédico</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/extras.css">
</head>

<body class="app-theme paramedico-dashboard">

<div class="layout">

<!-- SIDEBAR -->
<aside class="sidebar">

<h2>🚑 EMS System</h2>

<nav class="sidebar-menu">
<a href="#registro">Registro Paciente</a>
<a href="#signos">Signos Vitales</a>
<a href="#historial">Historial</a>
</nav>

</aside>

<!-- CONTENIDO -->
<main class="main-content">

<div class="topbar">
<h3 id="titulo_usuario">Dashboard Paramédico</h3>
<span class="rol-badge">Rol: Paramédico</span>
</div>


<button class="btn-secondary" onclick="volverDashboard()">
  ⬅ Volver al Dashboard
</button>

<button class="btn-danger"
onclick="localStorage.clear(); window.location.href='login.html'">
Cerrar sesión
</button>


<div class="content">

<!-- REGISTRO PACIENTE -->
<div class="card" id="registro">

<h2>🚑 Registro de Paciente</h2>

<div class="form-grid">

<div>
<label>Apellido</label>
<input type="text" id="apellido" placeholder="Apellido">
</div>

<div>
<label>Nombre</label>
<input type="text" id="nombre" placeholder="Nombre">
</div>

<div>
<label>Edad</label>
<input type="number" id="edad" placeholder="Edad">
</div>

<div>
<label>Sexo</label>
<select id="sexo">
<option value="">Seleccione</option>
<option value="Masculino">Masculino</option>
<option value="Femenino">Femenino</option>
<option value="Otro">Otro</option>
</select>
</div>

</div>

<button class="btn-primary" onclick="guardarPaciente()">
Guardar Paciente
</button>

</div>


<!-- SIGNOS VITALES -->
<div class="card" id="signos">

<h2>🩺 Registrar Signos Vitales</h2>

<label>Paciente</label>
<select id="paciente_select" onchange="cargarHistorial()"></select>

<div class="form-grid">

<div>
<label>Presión Arterial</label>
<input type="text" id="presion_arterial">
</div>

<div>
<label>Frecuencia Cardíaca</label>
<input type="number" id="frecuencia_cardiaca">
</div>

<div>
<label>Frecuencia Respiratoria</label>
<input type="number" id="frecuencia_respiratoria">
</div>

<div>
<label>SpO₂</label>
<input type="number" id="spo2">
</div>

<div>
<label>Temperatura</label>
<input type="number" step="0.1" id="temperatura">
</div>

</div>

<label>Observaciones</label>
<textarea id="observaciones"></textarea>

<button class="btn-primary" onclick="guardarSignos()">
Guardar Signos
</button>

</div>


<!-- HISTORIAL -->
<div class="card" id="historial">

<h2>📋 Historial del Paciente</h2>

<div class="table-wrapper">

<table class="styled-table">

<thead>
<tr>
<th>Fecha</th>
<th>Hora</th>
<th>PA</th>
<th>FR</th>
<th>FC</th>
<th>SpO₂</th>
<th>Temp</th>
<th>Obs</th>
<th>Registrado por</th>
</tr>
</thead>

<tbody id="historial_body"></tbody>

</table>

</div>

</div>

</div>

</main>

</div>


<script>

const API = "http://localhost:3000";
const token = localStorage.getItem("token");
const rol = localStorage.getItem("rol");
const nombre = localStorage.getItem("nombre");

if (!token) {
  alert('Acceso no autorizado');
  window.location.href = 'login.html';
}

// MOSTRAR NOMBRE
if(nombre){
document.getElementById("titulo_usuario").innerText =
`Dashboard Paramédico - ${nombre}`;
}


// =======================
// CARGAR PACIENTES
// =======================

function cargarPacientes(){

fetch(`${API}/pacientes`,{
headers:{Authorization:`Bearer ${token}`}
})

.then(res=>res.json())
.then(data=>{

const select=document.getElementById("paciente_select");
select.innerHTML="";

data.forEach(p=>{

const option=document.createElement("option");

option.value=p.id;
option.textContent=p.apellido_nombre;

select.appendChild(option);

});

if(data.length>0){
cargarHistorial();
}

});

}


// =======================
// CARGAR HISTORIAL
// =======================

function cargarHistorial(){

const paciente_id=document.getElementById("paciente_select").value;

if(!paciente_id)return;

fetch(`${API}/registros_signos/${paciente_id}`,{
headers:{Authorization:`Bearer ${token}`}
})

.then(res=>res.json())

.then(data=>{

const tbody=document.getElementById("historial_body");
tbody.innerHTML="";

data.forEach(r=>{

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${new Date(r.fecha).toLocaleDateString("es-AR")}</td>
<td>${r.hora_control}</td>
<td>${r.presion_arterial || ''}</td>
<td>${r.frecuencia_respiratoria || ''}</td>
<td>${r.frecuencia_cardiaca || ''}</td>
<td>${r.spo2 || ''}</td>
<td>${r.temperatura || ''}</td>
<td>${r.observaciones || ''}</td>
<td>${r.registrado_por || ''}</td>
`;

tbody.appendChild(tr);

});

});

}


// =======================
// GUARDAR PACIENTE
// =======================

function guardarPaciente(){

const apellido=document.getElementById("apellido").value.trim();
const nombre=document.getElementById("nombre").value.trim();
const edad=document.getElementById("edad").value;
const sexo=document.getElementById("sexo").value;

if(!apellido || !nombre){
alert("Apellido y nombre son obligatorios");
return;
}

fetch(`${API}/guardar`,{

method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${token}`
},

body:JSON.stringify({apellido,nombre,edad,sexo})

})

.then(res=>res.json())

.then(data=>{

alert(data.mensaje);

document.getElementById("apellido").value="";
document.getElementById("nombre").value="";
document.getElementById("edad").value="";
document.getElementById("sexo").value="";

cargarPacientes();

});

}


// =======================
// GUARDAR SIGNOS
// =======================
function guardarSignos(){

const paciente_id=document.getElementById("paciente_select").value;

const presion=document.getElementById("presion_arterial").value.trim();
const fc=parseInt(document.getElementById("frecuencia_cardiaca").value);
const fr=parseInt(document.getElementById("frecuencia_respiratoria").value);
const spo2=parseInt(document.getElementById("spo2").value);
const temp=parseFloat(document.getElementById("temperatura").value);
const observaciones=document.getElementById("observaciones").value.trim();


// =======================
// VALIDACIONES VACÍAS
// =======================

if(!paciente_id){
alert("⚠️ Seleccione un paciente");
return;
}

if(!presion || !fc || !fr || !spo2 || !temp){
alert("⚠️ Complete todos los signos vitales");
return;
}


// =======================
// VALIDAR PRESIÓN
// =======================

const regexPA=/^\d{2,3}\/\d{2,3}$/;

if(!regexPA.test(presion)){
alert("⚠️ Presión arterial inválida. Ejemplo: 120/80");
return;
}

const partesPA=presion.split("/");
const sistolica=parseInt(partesPA[0]);
const diastolica=parseInt(partesPA[1]);


// =======================
// RANGOS NORMALES
// =======================

// FC
if(fc < 30 || fc > 220){
alert("⚠️ Frecuencia cardíaca fuera de rango humano");
return;
}

// FR
if(fr < 5 || fr > 60){
alert("⚠️ Frecuencia respiratoria inválida");
return;
}

// SPO2
if(spo2 < 50 || spo2 > 100){
alert("⚠️ Saturación de oxígeno inválida");
return;
}

// TEMP
if(temp < 30 || temp > 45){
alert("⚠️ Temperatura inválida");
return;
}


// =======================
// ALERTAS MÉDICAS
// =======================

let alertas=[];


// HIPERTENSIÓN
if(sistolica >= 140 || diastolica >= 90){
alertas.push("🩸 Hipertensión arterial");
}

// HIPOTENSIÓN
if(sistolica < 90 || diastolica < 60){
alertas.push("🩸 Hipotensión arterial");
}

// TAQUICARDIA
if(fc > 100){
alertas.push("❤️ Taquicardia");
}

// BRADICARDIA
if(fc < 60){
alertas.push("❤️ Bradicardia");
}

// TAQUIPNEA
if(fr > 20){
alertas.push("🫁 Taquipnea");
}

// BRADIPNEA
if(fr < 12){
alertas.push("🫁 Bradipnea");
}

// HIPOXIA
if(spo2 < 90){
alertas.push("🫁 Hipoxia / Saturación baja");
}

// FIEBRE
if(temp >= 38){
alertas.push("🌡️ Fiebre");
}

// HIPOTERMIA
if(temp < 35){
alertas.push("🌡️ Hipotermia");
}


// =======================
// MOSTRAR ALERTAS
// =======================

if(alertas.length > 0){

alert(
"⚠️ ALERTAS MÉDICAS:\n\n" +
alertas.join("\n")
);

}


// =======================
// GUARDAR
// =======================

fetch(`${API}/registros_signos`,{

method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:`Bearer ${token}`
},

body:JSON.stringify({

paciente_id,

presion_arterial:presion,
frecuencia_cardiaca:fc,
frecuencia_respiratoria:fr,
spo2:spo2,
temperatura:temp,
observaciones

})

})

.then(res=>res.json())

.then(data=>{

alert(data.mensaje);

document.getElementById("presion_arterial").value="";
document.getElementById("frecuencia_cardiaca").value="";
document.getElementById("frecuencia_respiratoria").value="";
document.getElementById("spo2").value="";
document.getElementById("temperatura").value="";
document.getElementById("observaciones").value="";

cargarHistorial();

});

}



function volverDashboard() {
  const rol = localStorage.getItem('rol');

  if (rol === 'profesor') {
    window.location.href = 'dashboard_profesor.html';
  } else if (rol === 'coordinador') {
    window.location.href = 'dashboard_coordinador.html';
  } else if (rol === 'paramedico') {
    window.location.href = 'dashboard_paramedico.html';
  } else {
    window.location.href = 'login.html';
  }
}


document.addEventListener("DOMContentLoaded", () => {
  const rol = localStorage.getItem('rol');
  const btn = document.getElementById('btn-volver');

  if (btn && rol) {
    btn.textContent = `⬅ Volver a ${rol}`;
  }
});

window.onload=cargarPacientes;

</script>

<script src="dashboards.js"></script>

</body>
</html>
