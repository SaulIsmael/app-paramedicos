<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard Profesor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/cards.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/buttons.css">
  <link rel="stylesheet" href="css/tables.css">
  <link rel="stylesheet" href="css/calendar.css">
  <link rel="stylesheet" href="css/extras.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div class="dashboard-container">

  <h2 class="dashboard-title">🎓 Dashboard Profesor</h2>

  <!-- ================= CARDS ================= -->
  <div class="dashboard-cards">
    <div class="card">
      <span>Total Pacientes</span>
      <h3 id="total-pacientes">0</h3>
    </div>

    <div class="card">
      <span>Controles Hoy</span>
      <h3 id="controles-hoy">0</h3>
    </div>

    <div class="card">
      <span>Último Registro</span>
      <h3 id="ultimo-registro">-</h3>
    </div>
  </div>

  <!-- ================= ALERTAS ================= -->
  <div class="section">
    <h3>🚨 Alertas Clínicas</h3>
    <div class="table-wrapper">
      <table id="tabla-alertas" class="styled-table"></table>
    </div>
  </div>

  <!-- ================= FILTROS ================= -->
  <div class="section filtros">
    <div class="filtro-item">
      <label>Paciente</label>
      <select id="paciente_select" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>

    <div class="filtro-item">
      <label>Usuario</label>
      <select id="usuario_select" onchange="aplicarFiltros()">
        <option value="">Todos</option>
      </select>
    </div>

    <div class="filtro-item">
      <label>Fecha</label>
      <input type="date" id="filtro_fecha" onchange="aplicarFiltros()">
    </div>

    <div class="filtro-buttons">
      <button onclick="exportExcel()" class="btn-primary">Exportar Excel</button>
      <button onclick="exportPDF()" class="btn-primary">Exportar PDF</button>
      <button onclick="toggleUsuarios()" class="btn-secondary">Administrar Usuarios</button>
    </div>
  </div>

<button class="btn-primary" onclick="irADashboardParamedico()">
  🩺 Tomar Signos Vitales
</button>

<button class="btn-danger" onclick="limpiarPacientes()">
🧹 Limpiar Pacientes
</button>

<button class="btn-danger"
onclick="localStorage.clear(); window.location.href='login.html'">
Cerrar sesión
</button>

<!-- ================= TABLA REGISTROS ================= -->
  <div class="section">
    <div class="table-wrapper">
      <table id="tabla-registros" class="styled-table">
        <thead>
          <tr>
            <th>Paciente</th>
            <th>Sexo</th>
            <th>Fecha / Hora</th>
            <th>PA</th>
            <th>FR</th>
            <th>FC</th>
            <th>SpO₂</th>
            <th>Temp</th>
            <th>Observaciones</th>
            <th>Registrado por</th>
            <th>Rol</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <!-- ================= GESTIÓN USUARIOS ================= -->
  <div id="tabla-usuarios-container" class="section usuarios-panel" style="display:none;">
  <h3>👥 Gestión de Usuarios</h3>
  <div class="table-wrapper">
    <table id="tabla-usuarios" class="styled-table">
      <!-- Se genera dinámicamente en JS -->
    </table>
  </div>
</div>

<script>
const API = 'http://localhost:3000';
const token = localStorage.getItem('token');
const rol = localStorage.getItem('rol');

if (!token || rol !== 'profesor') {
  alert('Acceso no autorizado');
  window.location.href = 'login.html';
}

let registrosTotales = [];
let registrosFiltrados = [];
let usuariosTotales = [];

// 🔥 NUEVO
function obtenerNombreCompletoUsuario(usuarioData) {

  // 🔥 SI VIENE COMO OBJETO (EL ERROR ACTUAL)
  if (typeof usuarioData === 'object' && usuarioData !== null) {
    return `${usuarioData.apellido || ''}, ${usuarioData.nombre || ''}`.trim();
  }

  // 🔥 SI VIENE COMO STRING (COMO ANTES)
  const usuario = usuariosTotales.find(u => u.nombre === usuarioData);

  if (usuario) {
    return `${usuario.apellido || ''}, ${usuario.nombre || ''}`;
  }

  return usuarioData || "—";
}

// =======================
// FUNCION AUXILIAR FECHA + HORA
// =======================
function formatearFechaHora(fechaISO, horaControl) {
  if (!fechaISO) return "—";
  try {
    const fechaObj = new Date(fechaISO);
    const fechaFormateada = fechaObj.toLocaleDateString('es-AR', { day:'2-digit', month:'2-digit', year:'numeric' });
    return horaControl ? `${fechaFormateada} ${horaControl}` : fechaFormateada;
  } catch(err) {
    console.error("Error formateando fecha:", fechaISO, err);
    return "—";
  }
}

// ===============================
// CARGAR RESUMEN
// ===============================
async function cargarResumen() {
  try {
    const res = await fetch(`${API}/dashboard/resumen`, { headers:{ 'Authorization':'Bearer '+token }});
    const data = await res.json();
    document.getElementById('total-pacientes').textContent = data.total_pacientes || 0;
    document.getElementById('controles-hoy').textContent = data.controles_hoy || 0;
    document.getElementById('ultimo-registro').textContent = data.ultimo_registro ? data.ultimo_registro.apellido_nombre : '-';
  } catch(err){ console.error('Error resumen:', err); }
}

// ===============================
// CARGAR ALERTAS
// ===============================
async function cargarAlertas() {
  try {
    const res = await fetch(`${API}/dashboard/alertas`, { headers:{ 'Authorization':'Bearer '+token }});
    const data = await res.json();
    const tabla = document.getElementById('tabla-alertas');
    tabla.innerHTML = `<tr><th>Paciente</th><th>FC</th><th>FR</th><th>SpO₂</th><th>Temp</th><th>Fecha</th></tr>`;
    data.forEach(a=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${a.apellido_nombre}</td>
        <td>${a.frecuencia_cardiaca || ''}</td>
        <td>${a.frecuencia_respiratoria || ''}</td>
        <td>${a.spo2 || ''}</td>
        <td>${a.temperatura || ''}</td>
        <td>${formatearFechaHora(a.fecha, a.hora_control)}</td>
      `;
      tabla.appendChild(tr);
    });
  } catch(err){ console.error('Error alertas:', err); }
}

// ===============================
// CARGAR REGISTROS
// ===============================
async function cargarRegistros() {
  try {

    await cargarUsuarios(); // 🔥 CLAVE

    const res = await fetch(`${API}/registros_signos`, { headers:{ 'Authorization':'Bearer '+token }});
    registrosTotales = await res.json();
    registrosFiltrados = [...registrosTotales];
    cargarPacientesSelect();
    cargarUsuariosSelect();
    renderTabla();
  } catch(err){ console.error('Error registros:', err); }
}

// ===============================
// FILTROS
// ===============================
function cargarPacientesSelect() {
  const select = document.getElementById('paciente_select');
  select.innerHTML = '<option value="">Todos</option>';
  [...new Set(registrosTotales.map(r=>r.paciente))].forEach(nombre=>{
    const opt = document.createElement('option');
    opt.value = nombre;
    opt.textContent = nombre;
    select.appendChild(opt);
  });
}

// 🔥 MODIFICADO
function cargarUsuariosSelect() {
  const select = document.getElementById('usuario_select');
  select.innerHTML = '<option value="">Todos</option>';

  [...new Set(registrosTotales.map(r =>
    r.registrado_por ? obtenerNombreCompletoUsuario(r.registrado_por) : ''
  ))].forEach(nombre=>{
    if(nombre){
      const opt = document.createElement('option');
      opt.value = nombre;
      opt.textContent = nombre;
      select.appendChild(opt);
    }
  });
}

// 🔥 MODIFICADO
function aplicarFiltros() {
  const paciente = document.getElementById('paciente_select').value;
  const usuario = document.getElementById('usuario_select').value;
  const fecha = document.getElementById('filtro_fecha').value;

  registrosFiltrados = registrosTotales.filter(r=>{
    let ok=true;
    if(paciente) ok=ok&&r.paciente===paciente;
    if(usuario) ok=ok&&obtenerNombreCompletoUsuario(r.registrado_por)===usuario;
    if(fecha) ok=ok&&r.fecha===fecha;
    return ok;
  });

  renderTabla();
}

// ===============================
// RENDER TABLA REGISTROS
// ===============================
function renderTabla() {
  const tbody=document.querySelector("#tabla-registros tbody");
  if(!tbody) return;
  tbody.innerHTML="";

  registrosFiltrados.forEach(r=>{

    const paciente = r.paciente || "—";
    const sexo = r.sexo || "—";
    const fechaHora = formatearFechaHora(r.fecha, r.hora_control);
    const presion = r.presion_arterial || "—";
    const fr = r.frecuencia_respiratoria || "—";
    const fc = r.frecuencia_cardiaca || "—";
    const spo2 = r.spo2 || "—";
    const temp = r.temperatura || "—";
    const obs = r.observaciones || "—";

    // 🔥 ARREGLO CLAVE (SOPORTA STRING Y OBJETO)
    let registradoPor = "—";

    if (r.registrado_por) {
      if (typeof r.registrado_por === "object") {
        registradoPor = `${r.registrado_por.apellido || ''}, ${r.registrado_por.nombre || ''}`;
      } else {
        registradoPor = obtenerNombreCompletoUsuario(r.registrado_por);
      }
    }

    const rolUsuario = r.rol_usuario || "—";

    const fila=document.createElement("tr");
    fila.innerHTML=`
      <td>${paciente}</td>
      <td>${sexo}</td>
      <td>${fechaHora}</td>
      <td>${presion}</td>
      <td>${fr}</td>
      <td>${fc}</td>
      <td>${spo2}</td>
      <td>${temp}</td>
      <td>${obs}</td>
      <td>${registradoPor}</td>
      <td>${rolUsuario}</td>
    `;

    tbody.appendChild(fila);
  });
}

// ===============================
// EXPORT EXCEL
// ===============================
function exportExcel() {
  if(!registrosFiltrados.length) return alert('No hay datos');
  const wb = XLSX.utils.book_new();
  const exportData = registrosFiltrados.map(r=>({
    Paciente:r.paciente,
    Sexo:r.sexo||'—',
    'Fecha / Hora':formatearFechaHora(r.fecha,r.hora_control),
    PA:r.presion_arterial||'',
    FR:r.frecuencia_respiratoria||'',
    FC:r.frecuencia_cardiaca||'',
    'SpO₂':r.spo2||'',
    Temp:r.temperatura||'',
    Observaciones:r.observaciones||'',
    'Registrado por':r.registrado_por ? obtenerNombreCompletoUsuario(r.registrado_por) : '',
    Rol: r.rol_usuario||''
  }));
  const ws=XLSX.utils.json_to_sheet(exportData);
  XLSX.utils.book_append_sheet(wb,ws,'Registros');
  XLSX.writeFile(wb,'registros_profesor.xlsx');
}

// ===============================
// EXPORT PDF
// ===============================
function exportPDF() {
  if(!registrosFiltrados.length) return alert('No hay datos');
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF();
  const cols = ['Paciente','Sexo','Fecha / Hora','PA','FR','FC','SpO₂','Temp','Observaciones','Registrado por','Rol'];
  const rows = registrosFiltrados.map(r=>[
    r.paciente,
    r.sexo||'—',
    formatearFechaHora(r.fecha,r.hora_control),
    r.presion_arterial||'',
    r.frecuencia_respiratoria||'',
    r.frecuencia_cardiaca||'',
    r.spo2||'',
    r.temperatura||'',
    r.observaciones||'',
    r.registrado_por ? obtenerNombreCompletoUsuario(r.registrado_por) : '',
    r.rol_usuario||''
  ]);
  doc.autoTable({head:[cols],body:rows});
  doc.save('registros_profesor.pdf');
}

// ===============================
// USUARIOS (NO TOCADO)
// ===============================
async function cargarUsuarios() {
  if(rol!=='profesor') return;
  try {
    const res=await fetch(`${API}/usuarios`,{headers:{'Authorization':'Bearer '+token}});
    usuariosTotales=await res.json();
    const tabla=document.getElementById('tabla-usuarios');
    tabla.innerHTML='<tr><th>Apellido, Nombre</th><th>Email</th><th>Rol</th><th>Acción</th></tr>';
    usuariosTotales.filter(u=>u.rol==='coordinador'||u.rol==='paramedico').forEach(user=>{
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td>${user.apellido || ''}, ${user.nombre || ''}</td>
        <td>${user.email}</td>
        <td>${user.rol}</td>
        <td>
          <button onclick="eliminarUsuario(${user.id})" style="background:#ff5252;color:white;border:none;padding:5px 10px;border-radius:5px;cursor:pointer;">
            Eliminar
          </button>
        </td>
      `;
      tabla.appendChild(tr);
    });
  } catch(err){alert('Error al cargar usuarios');console.error(err);}
}

// ===============================
// LIMPIAR PACIENTES
// ===============================
async function limpiarPacientes() {
  if(!confirm("⚠ Esto eliminará TODOS los pacientes y registros. ¿Continuar?")) return;
  try {
    const res=await fetch(`${API}/limpiar-pacientes`,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    const data=await res.json();
    alert(data.mensaje||"Pacientes eliminados");
    await cargarRegistros();
    await cargarResumen();
    await cargarAlertas();
  } catch(err){console.error("Error limpiando pacientes:",err);alert("Error al limpiar pacientes");}
}

// ===============================
// ELIMINAR USUARIO
// ===============================
async function eliminarUsuario(id){
  if(!confirm('¿Seguro que desea eliminar este usuario?')) return;
  try{
    await fetch(`${API}/usuarios/${id}`,{method:'DELETE',headers:{'Authorization':'Bearer '+token}});
    alert('Usuario eliminado');
    cargarUsuarios();
  }catch(err){alert('No se pudo eliminar el usuario');console.error(err);}
}

function toggleUsuarios(){
  const container=document.getElementById('tabla-usuarios-container');
  container.style.display=container.style.display==='none'?'block':'none';
  if(container.style.display==='block') cargarUsuarios();
}

function irADashboardParamedico() {
  window.location.href = 'dashboard_paramedico.html';
}

// ===============================
// INIT
// ===============================
window.onload=()=>{
  cargarResumen();
  cargarAlertas();
  cargarRegistros();
  setInterval(()=>{cargarResumen();cargarAlertas();},10000);
};
</script>

</body>
</html>
