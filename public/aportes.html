<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Planilla de Aportes</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/forms.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/tables.css">
<link rel="stylesheet" href="css/calendar.css">
<link rel="stylesheet" href="css/extras.css">

<style>
#calendario {
  margin-top: 10px;
}
#calendarioUsuarios {
  margin-top: 15px;
}
</style>

</head>

<body class="paramedico-dashboard">

<div class="dashboard-container">

  <h1>💰 Planilla de Aportes</h1>

  <!-- FORMULARIO -->
  <div class="card">
    <h2>Registrar Aporte</h2>

    <form id="formAporte" class="form-aporte">
      
      <div>
      <label>Usuario:</label>
      <select id="usuario">
        <option value="">Seleccione usuario</option>
      </select>
      </div>

      <div>
      <label>Monto:</label>
      <input type="number" id="monto" required>
      </div>

      <div>
      <label>Tipo de pago:</label>
      <select id="tipo_pago">
        <option value="efectivo">Efectivo</option>
        <option value="transferencia">Transferencia</option>
      </select>
      </div>

      <div>  
      <label>Comprobante:</label>
      <input type="file" id="comprobante">
      </div>
      
      <button type="submit">Guardar Aporte</button>
    </form>
  </div>

  <!-- TABLA -->
  <div class="card">
    <h2>Listado de Aportes</h2>

    <table class="styled-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Monto</th>
          <th>Tipo</th>
          <th>Comprobante</th>
          <th>Fecha</th>
        </tr>
      </thead>
      <tbody id="tablaAportes"></tbody>
    </table>
  </div>


  <!-- CALENDARIO POR USUARIO -->
  <div class="card">
    <h2>📊 Estado mensual por usuario</h2>
    <div id="calendarioUsuarios"></div>
  </div>

</div>

<script src="aportes.js?v=2" defer></script>

</body>
</html>
